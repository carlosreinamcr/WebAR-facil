<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compilador local de marcadores · WebAR</title>
<style>body{font:17px system-ui;max-width:760px;margin:40px auto;padding:20px;background:#15202c;color:#f4f0e7}a{color:#8fe2d7}label{display:block;margin:24px 0}input,button{font:inherit;padding:10px}button{cursor:pointer}pre{white-space:pre-wrap}img{max-width:100%;max-height:280px}</style>
<h1>Compilar un marcador</h1><p>JPG/PNG → ORB/WASM → target.dat. Todo se procesa en tu dispositivo, en un Worker.</p>
<p><a href="../">Volver al ejemplo</a> · <a href="../marker.png" download>Descargar marcador de ejemplo</a></p>
<label>Imagen <input id="image" type="file" accept="image/png,image/jpeg"></label>
<label>Ancho de la imagen impresa (metros) <input id="width" type="number" min="0.001" step="0.001" value="0.2"></label>
<button id="compile">Compilar y descargar</button><a id="download" hidden>Descargar último marcador .dat</a><p id="status" role="status">Elige una imagen con detalles variados y buena cobertura.</p><pre id="report"></pre><img id="preview" alt="Vista previa del marcador" hidden>
<script type="module">
import {MarkerCompiler} from '../dist/webar-facil.core.js';
const compiler=new MarkerCompiler(),status=document.querySelector('#status'),button=document.querySelector('#compile');let previewURL,downloadURL;
document.querySelector('#image').onchange=event=>{if(previewURL)URL.revokeObjectURL(previewURL);const file=event.target.files[0];if(file){previewURL=URL.createObjectURL(file);document.querySelector('#preview').src=previewURL;document.querySelector('#preview').hidden=false;}};
button.onclick=async()=>{
  const file=document.querySelector('#image').files[0];if(!file){status.textContent='Selecciona un JPG o PNG.';return;}
  button.disabled=true;status.textContent='Extrayendo características en WASM…';
  try{const result=await compiler.compile(file,{physicalWidthMeters:Number(document.querySelector('#width').value),opencvURL:new URL('../vision/opencv.js',location.href).href});
    document.querySelector('#report').textContent=JSON.stringify(result.quality,null,2);
    if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(new Blob([result.buffer],{type:'application/octet-stream'}));const link=document.querySelector('#download');link.href=downloadURL;link.download=file.name.replace(/\.(jpg|jpeg|png)$/i,'')+'.dat';link.hidden=false;link.click();
    status.textContent='Marcador compilado. Guarda el .dat y usa el mismo ancho físico al imprimir.';
  }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
};
addEventListener('pagehide',()=>{compiler.dispose();if(previewURL)URL.revokeObjectURL(previewURL);if(downloadURL)URL.revokeObjectURL(downloadURL);},{once:true});
</script></html>
