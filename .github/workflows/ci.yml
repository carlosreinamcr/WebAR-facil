name: WebAR validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:vision
      - run: npm run generate:demo
      - run: npm run build
      - run: npm run docs:check
      - run: npm run check:release
      - run: npm test
      - run: npm run check:package
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run build
      - run: npm run docs:test-browser
        timeout-minutes: 5
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - name: Run browser tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p tests/generated
          npm run test:browser 2>&1 | tee tests/generated/browser-tests.log
        env:
          TEST_WEBKIT: '1'
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-evidence
          path: |
            tests/generated/*.png
            tests/generated/browser-tests.log
