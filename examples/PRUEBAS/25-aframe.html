<!doctype html>
<html lang="es">
<head>
<meta name="author" content="IngCarlosReina. - Realidad Aumentada Empezando Desde Cero">
<!-- Creador: IngCarlosReina. - Realidad Aumentada Empezando Desde Cero
Web: https://realidad-aumentada.com.co

YouTube: https://www.youtube.com/@carlosreinamcr -->

  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,"><title>25. Integración con A-Frame</title>
  <style>
    body { margin: 0; background: #edf3f8; color: #142b40; font: 16px/1.4 system-ui; }
    header { padding: 12px; } h1 { font-size: 21px; } button { padding: 10px; font: inherit; }
    #view { height: 62vh; height: 62dvh; min-height: 320px; position: relative; }
    a-scene { width: 100%; height: 100%; position: relative; }
  </style>
  <!-- A-Frame es un framework opcional, separado del SDK. Copia local de 1.8.0. -->
  <!-- A-Frame se registra antes de que el navegador analice sus entidades. -->
  <script src="../assets/aframe.min.js"></script>
  <!-- El SDK externo comparte la instancia Three.js de A-Frame. -->
  <script>window.THREE = AFRAME.THREE;</script>
  <script id="webar-sdk" defer src="../dist/webar-facil.browser.min.js"></script>
</head>
<body>
  <header>
    <a href="./index.html">← Galería</a>
    <h1>25. A-Frame con wrappers oficiales</h1>
  <p class="example-documentation" data-doc-en="aframe.html"><a href="../../docs/aframe.html#configuracion-de-una-pagina">Cómo desarrollar este ejemplo</a></p>
    <p>Un solo motor de tracking y una sola cámara. A-Frame renderiza la escena.</p>
    <p><a href="../assets/marcador.jpg" target="_blank" rel="noopener">Abrir marcador</a> en otra pantalla o imprimir.</p>
    <button id="start" type="button" disabled>Iniciar cámara</button>
    <button id="stop" type="button" disabled>Detener</button>
    <p id="message" role="status">Cargando A-Frame y el SDK…</p>
  </header>
  <div id="view">
    <a-scene id="aframe-scene" embedded vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false" renderer="alpha: true; antialias: true">
      <!-- El wrapper escribirá pose y proyección; desactivar controles de cámara de A-Frame. -->
      <a-entity camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
      <a-entity light="type: ambient; intensity: 1.5"></a-entity>
      <a-entity light="type: directional; intensity: 2" position="1 2 1"></a-entity>
      <a-entity id="anchor" visible="false"><a-entity id="content"></a-entity></a-entity>
    </a-scene>
  </div>
  <script>
    addEventListener('DOMContentLoaded', async () => {
      const frame = document.querySelector('#aframe-scene'), anchor = document.querySelector('#anchor');
      const content = document.querySelector('#content'), start = document.querySelector('#start');
      const stop = document.querySelector('#stop'), message = document.querySelector('#message');
      if (!globalThis.AFRAME || !globalThis.WebARFacil) {
        message.textContent = 'No cargó A-Frame o el SDK. Revisa las dos rutas del head.'; return;
      }
      // Resolver WASM/Draco desde el script real: funciona también al empaquetar.
      const sdkScript = document.querySelector('#webar-sdk');
      const base = new URL('.', sdkScript.src);
      const engine = new WebARFacil.WebAREngine({
        opencvURL: new URL('vision/opencv.js', base),
        camera: { performance: 'auto', playbackContainer: document.querySelector('#view') },
      });
      WebARFacil.registerAFrameComponent(AFRAME, engine);
      WebARFacil.registerAFrameModelComponent(AFRAME, { dracoDecoderPath: new URL('decoders/draco/', base) });
      const report = error => { message.textContent = error.message; };
      engine.onError(report);
      anchor.addEventListener('ar-error', event => report(event.detail));
      content.addEventListener('ar-model-error', event => report(event.detail));
      engine.onStatus(status => {
        if (status === 'target-loaded') message.textContent = 'Marcador preparado. Apunta a la imagen.';
        if (status === 'tracked') message.textContent = 'Modelo seguido por el wrapper oficial de A-Frame.';
      });
      try {
        if (!frame.hasLoaded) await new Promise(resolve => frame.addEventListener('loaded', resolve, { once: true }));
        start.disabled = false; message.textContent = 'Pulsa Iniciar cámara.';
      } catch (error) { report(error); return; }
      start.onclick = async () => {
        start.disabled = true; stop.disabled = false;
        try {
          // Instalar el fondo antes de abrir la cámara. El marcador se compila después.
          anchor.setAttribute('my-ar-tracker', { targetId: 'poster' });
          await engine.startCamera();
          content.setAttribute('my-ar-model', { src: '../assets/robot.glb', fitSize: 0.35, autoplay: true });
          // El componente compila el JPG y mantiene su matriz sincronizada con las poses.
          anchor.setAttribute('my-ar-tracker', { target: '../assets/marcador.jpg', targetId: 'poster', physicalWidth: 0.2 });
        } catch (error) { report(error); anchor.removeAttribute('my-ar-tracker'); await engine.stop(); start.disabled = false; stop.disabled = true; }
      };
      stop.onclick = async () => {
        stop.disabled = true;
        try {
          await engine.stop();
          // Quitar el componente libera sus listeners/fondo; reponerlo reinicia el target.
          anchor.removeAttribute('my-ar-tracker'); anchor.object3D.visible = false;
          message.textContent = 'Cámara detenida.';
        } catch (error) { report(error); }
        finally { start.disabled = false; }
      };
      addEventListener('pagehide', () => {
        engine.dispose(); anchor.removeAttribute('my-ar-tracker'); content.removeAttribute('my-ar-model');
      });
    });
  </script>
</body>
</html>
