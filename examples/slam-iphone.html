<!doctype html>
<html lang="es">
<head>
<meta name="author" content="IngCarlosReina. - Realidad Aumentada Empezando Desde Cero">
<!-- Creador: IngCarlosReina. - Realidad Aumentada Empezando Desde Cero
Web: https://realidad-aumentada.com.co
Blog: https://blog.realidad-aumentada.com.co
YouTube: https://www.youtube.com/@carlosreinamcr -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>SLAM sin marcador</title>
  <style>
    body{margin:0;background:#15202a;color:white;font:16px system-ui}
    header{padding:12px}button{padding:10px;margin-right:8px}
    #view{width:100%;height:70vh;height:70dvh}#status{min-height:3em}
  </style>
</head>
<body>
  <header>
    <button id="start">Iniciar SLAM</button>
    <button id="stop" disabled>Detener</button>
    <label>Tamaño <input id="size" type="range" min="0.1" max="5" step="0.1" value="1"></label>
    <p id="status" role="status">Pulsa Iniciar y apunta hacia una superficie con textura.</p>
  </header>
  <div id="view"></div>

  <script src="../dist/webar-facil.min.js"></script>
  <script>
    const {ThreeARScene,ThreeARModel}=WebARFacil;
    const startButton=document.querySelector('#start');
    const stopButton=document.querySelector('#stop');
    const statusElement=document.querySelector('#status');
    let receivedPose=false;

    const say=message=>{
      if(statusElement.textContent!==message)statusElement.textContent=message;
    };
    const report=error=>{
      say(error instanceof Error?error.message:String(error));
      console.error(error);
      startButton.disabled=false;
      stopButton.disabled=true;
    };

    const app=new ThreeARScene({
      container:document.querySelector('#view'),
      engineOptions:{
        opencvURL:new URL('../vision/opencv.js',location.href),
        camera:{width:1280,height:720,maxFrameWidth:640,fps:30},
      },
    });
    const model=new ThreeARModel({
      dracoDecoderPath:new URL('../decoders/draco/',location.href),
    });

    // Sin marcador registrado, la fachada publica las poses con ID "default".
    app.addContent('default',model);
    app.engine.onError(report);
    app.engine.onStatus(state=>{
      const messages={
        'camera-ready':'Cámara lista. Iniciando odometría…',
        'scan-floor':'Desplaza lentamente el teléfono sobre una superficie con textura. No solo lo gires.',
        'odometry-initializing':'Construyendo mapa: mantén detalles del entorno en vista y desplaza la cámara.',
        'odometry-lost':'Seguimiento perdido. Vuelve hacia una zona ya observada.',
        'camera-suspended':'Cámara suspendida: vuelve a esta pestaña.',
        'stopped':'SLAM detenido. Puedes iniciar un mapa nuevo.',
      };
      if(messages[state])say(messages[state]);
    });
    app.engine.onPose((_matrix,pose)=>{
      if(pose.backend!=='optical-flow')return;
      receivedPose=true;
      say(pose.scale==='relative'
        ?'Seguimiento activo · escala relativa. Ajusta el tamaño si lo necesitas.'
        :'Seguimiento activo · escala de referencia métrica.');
    });
    document.querySelector('#size').oninput=event=>{
      model.scale.setScalar(Number(event.currentTarget.value));
    };

    startButton.onclick=async()=>{
      startButton.disabled=true;stopButton.disabled=true;receivedPose=false;
      try{
        say('Cargando modelo…');
        // Sustituye esta ruta por tu GLB normal, Draco o Meshopt.
        await model.load('./assets/Kai-WebAR-Facil.glb',{fitSize:0.16,autoplay:true});
        await app.engine.startCamera();

        // Fuerza la odometría WASM: no requiere una sesión immersive-ar.
        // No se carga ninguna imagen ni se especifica targetId.
        const result=await app.engine.enableSLAM({
          backend:'optical-flow',
          placement:'auto',
        });
        console.info('Backend y colocación:',result);
        if(!receivedPose)say('Escanea una superficie con textura moviendo lentamente la cámara de lado a lado.');
        stopButton.disabled=false;
      }catch(error){
        await app.engine.stop();report(error);
      }
    };
    stopButton.onclick=async()=>{
      stopButton.disabled=true;
      try{await app.engine.stop();}
      catch(error){report(error);}
      finally{startButton.disabled=false;}
    };
    addEventListener('pagehide',()=>{void app.dispose();});
  </script>
</body>
</html>
